name: Build and deploy Storybook

on:
  push:
    branches: [ feature/storybook ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        # use npm install when package-lock.json is absent
        run: npm install --no-audit --prefer-offline

      - name: Build Storybook
        run: npx storybook build --output-dir storybook-static

      # Deploy directly to gh-pages using actions-gh-pages to avoid deprecated upload-artifact
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static
